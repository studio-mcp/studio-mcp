name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate package
        run: npm pack --dry-run

      - name: Verify bin script
        run: |
          test -x bin/studio-mcp.js
          head -n 1 bin/studio-mcp.js | grep -q "^#!/usr/bin/env node"
